[project]
name = "agentic-software-engineer"
version = "0.1.0"
description = "A safe, explainable coding-agent MVP for Python repositories"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3", "python-multipart>=0.0.9,<1", "httpx>=0.27,<1",
  "numpy>=2,<3", "faiss-cpu>=1.12,<2",
  "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.agents", "app.db", "app.rag", "app.tools"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI uses File(...) as an intentional dependency marker in route signatures.
ignore = ["B008"]

